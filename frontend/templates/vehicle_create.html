<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Создание техники</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
</head>
<body>
    <div id="menu-container"></div>
    <div class="form-wrapper">
        <h2 class="mb-4">Создание техники</h2>

        <form method="post" enctype="multipart/form-data">
            <div class="mb-3">
                <label for="id_reg_number" class="form-label">Регистрационный номер</label>
                <input type="text" name="reg_number" class="form-control" id="id_reg_number" required>
            </div>

            <div class="mb-3">
                <label for="id_brand" class="form-label">Марка</label>
                <input type="text" name="brand" class="form-control" id="id_brand" required>
            </div>

            <div class="mb-3">
                <label for="id_date_purchase" class="form-label">Дата покупки</label>
                <input type="date" name="date_purchase" class="form-control" id="id_date_purchase" required>
            </div>

            <div class="mb-3">
                <label for="id_type" class="form-label">Тип техники</label>
                <select name="type" class="form-select" id="id_type" required>
                    <option value=""></option>
                    <option value="car">Самосвал</option>
                    <option value="truck">Трактор</option>
                    <option value="special">Экскаватор</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="id_mileage" class="form-label">Пробег (км)</label>
                <input type="number" name="mileage" class="form-control" id="id_mileage" required>
            </div>

            <div class="mb-3">
                <label for="id_operation_status" class="form-label">Статус работы</label>
                <select name="operation_status" class="form-select" id="id_operation_status" required>
                    <option value=""></option>
                    <option value="working">В работе</option>
                    <option value="repair">В ремонте</option>
                    <option value="idle">Простой</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Фотографии техники</label>
                <input type="hidden" name="form-TOTAL_FORMS" value="1">
                <input type="hidden" name="form-INITIAL_FORMS" value="0">

                <div class="image-form mb-2">
                    <input type="file" name="form-0-file" class="form-control">
                </div>
            </div>

            <button type="submit" class="btn btn-primary">Сохранить</button>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/menu.js"></script>
</body>
</html>
