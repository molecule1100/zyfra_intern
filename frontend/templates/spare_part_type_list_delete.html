<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Типы запчастей</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      padding: 20px;
    }
    .container {
      padding: 0;
    }
    .table {
      margin-bottom: 20px;
    }
    .table th, .table td {
      text-align: left;
      padding: 8px 12px;
    }
    .actions-column {
      white-space: nowrap;
    }
    .deleted-icon {
      color: #dc3545;
      font-weight: bold;
    }
    .not-deleted-icon {
      color: #28a745;
      font-weight: bold;
    }
    .pagination {
      margin: 0;
    }
  </style>
</head>
<body>
  <div id="menu-container"></div>

  <div class="container">
    <h1 style="margin-bottom: 20px;">Типы запчастей</h1>

    <div class="table-responsive">
      <table class="table table-bordered" style="width: 100%;">
        <thead>
          <tr>
            <th>ID</th>
            <th>Название</th>
            <th>Дата создания</th>
            <th>Удалено</th>
            <th>Действия</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>1</td>
            <td>Тормозные колодки</td>
            <td>2023-05-15</td>
            <td><span class="not-deleted-icon">✗</span></td>
            <td class="actions-column">
              <a href="#" class="btn btn-sm btn-outline-primary" style="margin-right: 5px;">Редактировать</a>
              <a href="#" class="btn btn-sm btn-outline-danger" onclick="return confirmDelete('Тормозные колодки')">Удалить</a>
            </td>
          </tr>
          <tr>
            <td>2</td>
            <td>Масляный фильтр</td>
            <td>2023-06-20</td>
            <td><span class="deleted-icon">✔</span></td>
            <td class="actions-column">
              <a href="#" class="btn btn-sm btn-outline-primary" style="margin-right: 5px;">Редактировать</a>
            </td>
          </tr>
          <tr>
            <td>3</td>
            <td>Воздушный фильтр</td>
            <td>2023-07-10</td>
            <td><span class="not-deleted-icon">✗</span></td>
            <td class="actions-column">
              <a href="#" class="btn btn-sm btn-outline-primary" style="margin-right: 5px;">Редактировать</a>
              <a href="#" class="btn btn-sm btn-outline-danger" onclick="return confirmDelete('Воздушный фильтр')">Удалить</a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div style="margin-top: 10px;">
      <nav aria-label="Page navigation">
        <ul class="pagination" style="padding-left: 0;">
          <li class="page-item disabled">
            <a class="page-link" href="#">Предыдущая</a>
          </li>
          <li class="page-item active">
            <a class="page-link" href="#">1</a>
          </li>
          <li class="page-item">
            <a class="page-link" href="#">2</a>
          </li>
          <li class="page-item">
            <a class="page-link" href="#">3</a>
          </li>
          <li class="page-item">
            <a class="page-link" href="#">Следующая</a>
          </li>
        </ul>
      </nav>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/menu.js"></script>
  <script src="../js/spare_part_type_list_delete.js"></script>
</body>
</html>
