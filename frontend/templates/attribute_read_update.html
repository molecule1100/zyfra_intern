<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Редактирование атрибута</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding: 20px;
            background-color: #f8f9fa;
        }
        .container {
            max-width: 100%;
            padding: 0;
        }
        .form-section {
            margin-bottom: 25px;
        }
        .form-section h5 {
            font-weight: 500;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }
        .form-control {
            max-width: 400px;
            background-color: white;
            border: 1px solid #ced4da;
        }
        .form-label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }
        .info-text {
            padding: 8px 0;
            border-bottom: 1px solid #dee2e6;
        }
        .btn-action {
            margin-right: 10px;
            min-width: 100px;
        }
    </style>
</head>
<body>
    <div id="menu-container"></div>

    <div class="container">
        <h2 class="mb-4">Редактирование атрибута</h2>

        <form method="post" novalidate>
            <input type="hidden" name="csrfmiddlewaretoken" value="пример_токена">

            <div class="form-section">
                <label class="form-label">Название</label>
                <input type="text" name="name" class="form-control" value="Размер">
                <div class="text-danger" style="display: none;">Пример ошибки</div>
            </div>

            <div class="form-section">
                <label class="form-label">Единица измерения</label>
                <input type="text" name="unit" class="form-control" value="мм">
                <div class="text-danger" style="display: none;">Пример ошибки</div>
            </div>

            <div class="form-section">
                <label class="form-label">Тип данных</label>
                <select name="data_type" class="form-control">
                    <option value="string">Текст</option>
                    <option value="number" selected>Число</option>
                    <option value="boolean">Да/Нет</option>
                </select>
                <div class="text-danger" style="display: none;">Пример ошибки</div>
            </div>

            <div class="form-section">
                <label class="form-label">Дата создания</label>
                <div class="info-text">2023-05-15</div>
            </div>

            <div class="form-section">
                <label class="form-label">Дата обновления</label>
                <div class="info-text">2023-06-10</div>
            </div>

            <div class="form-section">
                <label class="form-label">Удален</label>
                <div class="info-text">✕</div>
            </div>

            <div class="mt-4">
                <button type="submit" class="btn btn-primary btn-action">Сохранить</button>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/menu.js"></script>
</body>
</html>
