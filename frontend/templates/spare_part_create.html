<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Создание запчасти</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding: 20px;
        }
        .container {
            padding: 0;
            max-width: 100%;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 25px;
            font-weight: 500;
        }
        .form-section {
            margin-bottom: 25px;
        }
        .section-title {
            font-weight: 500;
            margin-bottom: 15px;
            font-size: 18px;
        }
        .table-attributes {
            width: 100%;
            max-width: 600px;
        }
        .table-attributes th {
            text-align: left;
            padding: 8px 0;
            border-bottom: 1px solid #dee2e6;
            font-weight: 500;
        }
        .table-attributes td {
            padding: 8px 0;
            border-bottom: 1px solid #dee2e6;
            vertical-align: top;
        }
        .example-text {
            color: #6c757d;
            font-size: 13px;
            margin-top: 5px;
        }
        .file-status {
            color: #6c757d;
            font-size: 13px;
            margin-top: 5px;
        }
        .form-control, .form-select {
            max-width: 400px;
        }
    </style>
</head>
<body>
    <div id="menu-container"></div>

    <div class="container">
        <h1>Создание запчасти</h1>

        <form method="post" enctype="multipart/form-data" novalidate>
            <div class="form-section">
                <div class="section-title">Тип запчасти</div>
                <select name="spare_part_type" class="form-select">
                    <option value="1">Фильтр масляный</option>
                    <option value="2">Ремень ГРМ</option>
                    <option value="3">Тормозные колодки</option>
                </select>
            </div>
            <div class="form-section">
                <div class="section-title">Закрепить за техникой</div>
                <select name="vehicle" class="form-select">
                    <option value="1">Трактор Т-150 (А123БВ77)</option>
                    <option value="2">Экскаватор EK-18 (Б456ГД78)</option>
                </select>
            </div>
            <div class="form-section">
                <div class="section-title">Статус</div>
                <select name="status" class="form-select">
                    <option value="installed">Установлено</option>
                    <option value="in_stock">На складе</option>
                    <option value="repair">В ремонте</option>
                </select>
            </div>
            <div class="form-section">
                <div class="section-title">Атрибуты</div>
                <table class="table-attributes">
                    <thead>
                        <tr>
                            <th>Название</th>
                            <th>Значение</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Диаметр (мм)</td>
                            <td>
                                <input type="text" name="attr_1_value" class="form-control form-control-sm">
                                <div class="example-text">Например: 120</div>
                                <input type="hidden" name="attr_1_selected" value="on">
                            </td>
                        </tr>
                        <tr>
                            <td>Вес (кг)</td>
                            <td>
                                <input type="text" name="attr_2_value" class="form-control form-control-sm">
                                <div class="example-text">Например: 2.5</div>
                                <input type="hidden" name="attr_2_selected" value="on">
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="form-section">
                <div class="section-title">Фотографии</div>
                <div class="mb-3">
                    <input type="file" name="form-0-file" class="form-control form-control-sm" style="max-width: 400px;">
                    <div class="file-status">Файл не выбран</div>
                </div>
                <div class="mb-3">
                    <input type="file" name="form-1-file" class="form-control form-control-sm" style="max-width: 400px;">
                    <div class="file-status">Файл не выбран</div>
                </div>
                <div class="mb-3">
                    <input type="file" name="form-2-file" class="form-control form-control-sm" style="max-width: 400px;">
                    <div class="file-status">Файл не выбран</div>
                </div>
            </div>

            <button type="submit" class="btn btn-primary">Сохранить</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/menu.js"></script>
</body>
</html>
