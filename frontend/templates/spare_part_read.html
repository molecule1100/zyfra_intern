<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Тип запчасти — Просмотр</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding: 20px;
            background-color: #f8f9fa;
        }
        .container {
            padding: 0;
            max-width: 100%;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 25px;
            font-weight: 500;
        }
        h2 {
            font-size: 20px;
            margin: 25px 0 15px 0;
            font-weight: 500;
            border-bottom: 1px solid #dee2e6;
            padding-bottom: 5px;
        }
        .info-table {
            width: 100%;
            max-width: 800px;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        .info-table th, .info-table td {
            padding: 10px;
            border: 1px solid #dee2e6;
            text-align: left;
            vertical-align: top;
        }
        .info-table th {
            width: 150px;
            background-color: #f8f9fa;
            font-weight: 500;
        }
        .attributes-table {
            width: 100%;
            max-width: 800px;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        .attributes-table th, .attributes-table td {
            padding: 10px;
            border: 1px solid #dee2e6;
            text-align: left;
        }
        .attributes-table th {
            background-color: #f8f9fa;
            font-weight: 500;
        }
        .photos-section {
            margin-bottom: 25px;
        }
        .photo-thumbnail {
            width: 150px;
            height: 150px;
            object-fit: cover;
            margin-right: 15px;
            margin-bottom: 15px;
            border: 1px solid #dee2e6;
        }
        .log-entry {
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px dashed #dee2e6;
        }
        .log-date {
            font-weight: 500;
            margin-right: 10px;
        }
        .deleted-status {
            color: #dc3545;
            font-weight: bold;
        }
        .vehicle-link {
            color: #0d6efd;
            text-decoration: none;
        }
        .vehicle-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div id="menu-container"></div>
    <div class="container">
        <h1>Информация о запчасти</h1>

        <table class="info-table">
            <tr>
                <th>Тип запчасти</th>
                <td>Пример типа запчасти</td>
            </tr>
            <tr>
                <th>Техника</th>
                <td>
                    <a href="#" class="vehicle-link">
                        Пример марки ABC123
                    </a>
                </td>
            </tr>
            <tr>
                <th>Статус</th>
                <td>Пример статуса</td>
            </tr>
            <tr>
                <th>Создано</th>
                <td>2023-01-01 12:00</td>
            </tr>
            <tr>
                <th>Обновлено</th>
                <td>2023-01-02 14:30</td>
            </tr>
            <tr>
                <th>Удалено</th>
                <td class="deleted-status">✗</td>
            </tr>
        </table>

        <h2>Атрибуты</h2>
        <table class="attributes-table">
            <thead>
                <tr>
                    <th>Название</th>
                    <th>Значение</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Пример атрибута 1 (ед.изм.)</td>
                    <td>Значение 1</td>
                </tr>
                <tr>
                    <td>Пример атрибута 2</td>
                    <td>Значение 2</td>
                </tr>
            </tbody>
        </table>

        <h2>Фотографии</h2>
        <div class="photos-section">
            <div style="font-weight: 500; margin-bottom: 10px;"></div>
            <div>
                <img src="https://via.placeholder.com/150" class="photo-thumbnail" alt="Фото запчасти">
                <img src="https://via.placeholder.com/150" class="photo-thumbnail" alt="Фото запчасти">
            </div>
        </div>
        <div style="margin-top: 30px;">
            <a href="#" class="btn btn-secondary">К списку</a>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/menu.js"></script>
</body>
</html>
