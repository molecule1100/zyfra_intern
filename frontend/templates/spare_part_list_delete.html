<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Список запчастей</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding: 20px;
            background-color: #f8f9fa;
        }
        .container {
            padding: 0;
            max-width: 100%;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
        }
        .table-container {
            overflow-x: auto;
        }
        .spare-parts-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        .spare-parts-table th,
        .spare-parts-table td {
            padding: 12px 15px;
            border: 1px solid #dee2e6;
            text-align: left;
        }
        .spare-parts-table th {
            background-color: #f2f2f2;
            font-weight: 500;
        }
        .action-btn {
            padding: 5px 10px;
            margin-right: 5px;
            font-size: 14px;
        }
        .deleted-icon {
            font-weight: bold;
        }
        .deleted-yes {
            color: #28a745;
        }
        .deleted-no {
            color: #dc3545;
        }
        .pagination {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div id="menu-container"></div>

    <div class="container">
        <h1>Список запчастей</h1>

        <div class="table-container">
            <table class="spare-parts-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Тип</th>
                        <th>Техника</th>
                        <th>Статус</th>
                        <th>Создано</th>
                        <th>Удалено</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1</td>
                        <td>Фильтр масляный</td>
                        <td>Трактор А123БВ77</td>
                        <td>Установлено</td>
                        <td>2023-05-10</td>
                        <td>
                            <span class="deleted-icon deleted-no">✕</span>
                        </td>
                        <td>
                            <a href="#" class="btn btn-sm btn-outline-primary action-btn">Открыть</a>
                            <a href="#" class="btn btn-sm btn-outline-secondary action-btn">Редактировать</a>
                            <form method="post" action="#" onsubmit="return confirmDelete('Фильтр масляный');" style="display: inline;">
                                <button type="submit" class="btn btn-sm btn-outline-danger action-btn">Удалить</button>
                            </form>
                        </td>
                    </tr>
                    <tr>
                        <td>2</td>
                        <td>Ремень ГРМ</td>
                        <td>Экскаватор Б456ГД78</td>
                        <td>На складе</td>
                        <td>2023-06-15</td>
                        <td>
                            <span class="deleted-icon deleted-yes">✔</span>
                        </td>
                        <td>
                            <a href="#" class="btn btn-sm btn-outline-primary action-btn">Открыть</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <nav>
            <ul class="pagination justify-content-center">
                <li class="page-item disabled">
                    <a class="page-link" href="#">Предыдущая</a>
                </li>
                <li class="page-item active">
                    <a class="page-link" href="#">1</a>
                </li>
                <li class="page-item">
                    <a class="page-link" href="#">2</a>
                </li>
                <li class="page-item">
                    <a class="page-link" href="#">Следующая</a>
                </li>
            </ul>
        </nav>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/menu.js"></script>
    <script src="../js/spare_part_list_delete.js"></script>
</body>
</html>
