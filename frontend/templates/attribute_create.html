<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Создание атрибута</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding: 20px;
            background-color: #f8f9fa;
        }
        .container {
            max-width: 100%;
            padding: 0;
        }
        .form-section {
            margin-bottom: 25px;
        }
        .form-section h5 {
            font-weight: 500;
            margin-bottom: 15px;
        }
        .form-control {
            max-width: 400px;
        }
        .form-label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }
        .example-text {
            color: #6c757d;
            font-size: 0.9rem;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div id="menu-container"></div>

    <div class="container">
        <h2 class="mb-4">Создание атрибута</h2>

        <form method="post" novalidate>
            <input type="hidden" name="csrfmiddlewaretoken" value="пример_токена">

            <div class="form-section">
                <label class="form-label">Название</label>
                <input type="text" name="name" class="form-control" value="">
                <div class="example-text">Пример: Размер, Материал, Вес</div>
                <div class="text-danger" style="display: none;">Пример ошибки</div>
            </div>

            <div class="form-section">
                <label class="form-label">Единица измерения</label>
                <input type="text" name="unit" class="form-control" value="">
                <div class="example-text">Пример: мм, кг, л</div>
                <div class="text-danger" style="display: none;">Пример ошибки</div>
            </div>

            <div class="form-section">
                <label class="form-label">Тип данных</label>
                <select name="data_type" class="form-control">
                    <option value="string" selected>Текст</option>
                    <option value="number">Число</option>
                    <option value="boolean">Да/Нет</option>
                </select>
                <div class="text-danger" style="display: none;">Пример ошибки</div>
            </div>

            <div class="mt-4">
                <button type="submit" class="btn btn-primary">Сохранить</button>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/menu.js"></script>
</body>
</html>
