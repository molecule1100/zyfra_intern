<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Редактирование запчасти</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding: 20px;
            background-color: #f8f9fa;
        }
        .container {
            max-width: 100%;
            padding: 0;
        }
        .form-section {
            margin-bottom: 25px;
        }
        .form-section h5 {
            font-weight: 500;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }
        .attribute-table {
            width: 100%;
            border-collapse: collapse;
        }
        .attribute-table th, .attribute-table td {
            padding: 8px 12px;
            border: 1px solid #dee2e6;
            text-align: left;
        }
        .attribute-table th {
            background-color: #f8f9fa;
            font-weight: 500;
        }
        .photo-upload {
            margin-bottom: 10px;
        }
        .current-photo {
            font-weight: 500;
            margin-bottom: 5px;
        }
        .btn-action {
            margin-right: 10px;
            min-width: 100px;
        }
        .form-control {
            max-width: 400px;
        }
        .img-thumbnail {
            max-height: 150px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div id="menu-container"></div>

    <div class="container">
        <h2 class="mb-4">Редактирование запчасти</h2>

        <form method="post" enctype="multipart/form-data" novalidate>
            <input type="hidden" name="csrfmiddlewaretoken" value="пример_токена">

            <div class="form-section">
                <h5>Тип запчасти</h5>
                <select name="spare_part_type" class="form-control">
                    <option value="1" selected>Тормозные колодки</option>
                    <option value="2">Масляный фильтр</option>
                    <option value="3">Воздушный фильтр</option>
                </select>
            </div>

            <div class="form-section">
                <h5>Закрепить за техникой</h5>
                <select name="vehicle" class="form-control">
                    <option value="1" selected>Грузовик ABC123</option>
                    <option value="2">Автобус DEF456</option>
                </select>
            </div>

            <div class="form-section">
                <h5>Статус</h5>
                <select name="status" class="form-control">
                    <option value="1" selected>Установлен</option>
                    <option value="2">На складе</option>
                    <option value="3">Требует замены</option>
                </select>
            </div>

            <div class="form-section">
                <h5>Атрибуты</h5>
                <table class="attribute-table">
                    <thead>
                        <tr>
                            <th width="10%">Выбрать</th>
                            <th width="40%">Название</th>
                            <th width="50%">Значение</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td class="text-center">
                                <input type="checkbox" class="form-check-input" name="attr_1_selected" checked>
                            </td>
                            <td>Размер (мм)</td>
                            <td>
                                <input type="text" class="form-control" name="attr_1_value" value="120x80" placeholder="Введите значение">
                            </td>
                        </tr>
                        <tr>
                            <td class="text-center">
                                <input type="checkbox" class="form-check-input" name="attr_2_selected">
                            </td>
                            <td>Материал</td>
                            <td>
                                <input type="text" class="form-control" name="attr_2_value" value="" placeholder="Введите значение">
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="form-section">
                <h5>Текущие фотографии</h5>
                <div class="current-photo">Фото 1</div>
                <img src="https://via.placeholder.com/150" class="img-thumbnail">
                <div class="form-check">
                    <input type="checkbox" name="delete_photo_1" class="form-check-input" id="delete_photo_1">
                    <label class="form-check-label text-danger" for="delete_photo_1">
                        Удалить фото
                    </label>
                </div>

                <h5 class="mt-4">Добавить фотографии</h5>
                <input type="hidden" name="photo-TOTAL_FORMS" value="3">
                <input type="hidden" name="photo-INITIAL_FORMS" value="1">
                <input type="hidden" name="photo-MIN_NUM_FORMS" value="0">
                <input type="hidden" name="photo-MAX_NUM_FORMS" value="3">

                <div class="photo-upload">
                    <input type="file" name="photo-0-file" class="form-control" accept="image/*">
                </div>
                <div class="photo-upload">
                    <input type="file" name="photo-1-file" class="form-control" accept="image/*">
                </div>
            </div>

            <div class="mt-4">
                <button type="submit" class="btn btn-primary btn-action">Сохранить</button>
                <a href="#" class="btn btn-danger btn-action" onclick="return confirm('Вы уверены, что хотите удалить эту запчасть?')">Удалить</a>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/menu.js"></script>
</body>
</html>
