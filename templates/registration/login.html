<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Вход</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
<div class="container" style="max-width: 400px; margin-top: 80px;">
  <h2 class="mb-4">Вход в систему</h2>
  {% if form.errors %}
    <div class="alert alert-danger">Неверный логин или пароль.</div>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label for="id_username" class="form-label">Логин</label>
      <input type="text" name="username" id="id_username" class="form-control" autofocus required>
    </div>
    <div class="mb-3">
      <label for="id_password" class="form-label">Пароль</label>
      <input type="password" name="password" id="id_password" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-dark w-100">Войти</button>
  </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
