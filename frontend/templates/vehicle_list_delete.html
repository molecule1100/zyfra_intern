<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Список техники</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      padding: 20px 10px;
      background-color: #f8f9fa;
    }
    .container {
      max-width: 100%;
      padding: 0;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 15px;
      text-align: left;
    }
    .filter-input {
      max-width: 300px;
    }
    .deleted-true {
      color: #dc3545;
      font-weight: bold;
    }
    .deleted-false {
      color: #28a745;
      font-weight: bold;
    }
    .action-buttons {
      white-space: nowrap;
    }
    .action-buttons .btn {
      margin-right: 5px;
    }
    .action-buttons .btn:last-child {
      margin-right: 0;
    }
    .table {
      margin: 0;
    }
    .table th, .table td {
      padding: 8px 12px;
      text-align: left;
    }
    .form-label {
      text-align: left;
      display: block;
    }
    .pagination {
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <div id="menu-container"></div>
  <div class="container">
    <h1>Список техники</h1>

    <div class="mb-3">
      <label for="brandFilter" class="form-label">Фильтр по бренду</label>
      <input type="text" class="form-control filter-input" id="brandFilter" placeholder="Например, TR">
    </div>

    <div class="table-responsive">
      <table class="table table-hover align-middle">
        <thead class="table-light">
          <tr>
            <th>ID</th>
            <th>Рег. номер</th>
            <th>Бренд</th>
            <th>Тип</th>
            <th>Пробег</th>
            <th>Дата покупки</th>
            <th>Статус</th>
            <th>Удалено</th>
            <th>Действия</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>1</td>
            <td>RNDM</td>
            <td>TR</td>
            <td>Трактор</td>
            <td>1010101</td>
            <td>15.05.2025</td>
            <td>
              <span class="badge bg-success">В работе</span>
            </td>
            <td>
              <span class="deleted-false">✗</span>
            </td>
            <td class="action-buttons">
              <a href="#" class="btn btn-sm btn-outline-primary">Открыть</a>
              <a href="#" class="btn btn-sm btn-outline-secondary">Редактировать</a>
              <form method="post" action="#" class="d-inline">
                <button type="submit" class="btn btn-sm btn-outline-danger"
                        onclick="return confirmDelete('А123БВ77')">
                  Удалить
                </button>
              </form>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <nav aria-label="Page navigation">
      <ul class="pagination justify-content-start">
        <li class="page-item disabled">
          <a class="page-link" href="#" tabindex="-1">Предыдущая</a>
        </li>
        <li class="page-item active">
          <a class="page-link" href="#">1</a>
        </li>
        <li class="page-item">
          <a class="page-link" href="#">2</a>
        </li>
        <li class="page-item">
          <a class="page-link" href="#">Следующая</a>
        </li>
      </ul>
    </nav>
  </div>
  <script src="../js/vehicle_list_delete.js"></script>
  <script src="../js/menu.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
